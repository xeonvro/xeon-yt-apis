services:
  - type: web
    name: yt-downloader-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-frontend.example.com   # or * 
      - key: CONVERTER_URL
        value: https://ht.flvto.online/converter
      - key: MAX_RETRIES
        value: "12"
      - key: RETRY_DELAY_MS
        value: "5000"
